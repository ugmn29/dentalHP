<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="こども矯正の治療タイミング"><rect width="1600" height="900" fill="#FAFAF7"/><rect x="70" y="58" width="1460" height="784" rx="18" fill="#FFFFFF" stroke="#D9D6CE"/><text x="120" y="126" font-family="Noto Serif JP, Hiragino Mincho ProN, Yu Mincho, serif" font-size="45" font-weight="600" fill="#2C2C2A">こども矯正の治療タイミング</text><text x="122" y="168" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="500" fill="#6B6B68">成長段階に合わせて確認するポイント</text><line x1="120" y1="205" x2="1480" y2="205" stroke="#D9D6CE"/><circle cx="260" cy="420" r="72" fill="#0A8A85" opacity="0.12" stroke="#0A8A85" stroke-width="4"/><text x="260" y="405" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="600" fill="#0A8A85">0-3歳</text><text x="260" y="452" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#2C2C2A">口腔機能</text><circle cx="590" cy="420" r="72" fill="#0A8A85" opacity="0.12" stroke="#0A8A85" stroke-width="4"/><text x="590" y="405" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="600" fill="#0A8A85">6歳前後</text><text x="590" y="452" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#2C2C2A">生え変わり</text><circle cx="920" cy="420" r="72" fill="#E5A84C" opacity="0.12" stroke="#E5A84C" stroke-width="4"/><text x="920" y="405" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="600" fill="#E5A84C">混合歯列期</text><text x="920" y="452" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#2C2C2A">顎の成長</text><circle cx="1250" cy="420" r="72" fill="#E5A84C" opacity="0.12" stroke="#E5A84C" stroke-width="4"/><text x="1250" y="405" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="27" font-weight="600" fill="#E5A84C">永久歯列期</text><text x="1250" y="452" text-anchor="middle" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="600" fill="#2C2C2A">仕上げ</text><path d="M350 420 C 435 420, 435 420, 520 420" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round"/><path d="M508 412 L520 420 L508 428" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M680 420 C 765 420, 765 420, 850 420" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round"/><path d="M838 412 L850 420 L838 428" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M1010 420 C 1095 420, 1095 420, 1180 420" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round"/><path d="M1168 412 L1180 420 L1168 428" fill="none" stroke="#0A8A85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="180" y="610" width="1240" height="120" rx="10" fill="#FFFFFF" stroke="#D9D6CE"/><rect x="180" y="610" width="1240" height="8" rx="4" fill="#0ABAB5"/><text x="204" y="658" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="25" font-weight="700" fill="#2C2C2A">ポイント</text><text x="204" y="698" font-family="Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="19" font-weight="500" fill="#6B6B68">歯並びだけでなく、呼吸・舌・姿勢も一緒に確認</text></svg>